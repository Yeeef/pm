# pm on every pull request: built on both release targets as the release builds it (cgo, native runners), go vet and
# the Go tests (make test-go), split into parallel jobs per target: the build, vet and every package's tests but
# internal/work's; internal/work's tests, the longest; the race tests. The step summary records the binary's size per
# target. pm-release-build.yml runs the release build test, pm-tests.yml the harness suite.
#
# The Go caches (GOMODCACHE and GOCACHE) are saved by each push to main, one per target, Go version, kind (build, race)
# and go.sum, and a pull request restores main's latest, so a PR compiles only what it changed. A run that finds none
# for its go.sum (a dependency change, a new Go version, an evicted cache) restores the latest of its kind and saves its
# own, so the PR's next push is warm. GOFLAGS=-count=1: the restored cache never stands in for a test run.
name: pm go

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pm-go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, linux-amd64]
        suite: [build-vet-test, work, race]
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-amd64
            runner: ubuntu-22.04  # glibc 2.35, the oldest the release links against
          - suite: build-vet-test
            cache: build
            save: true
            run: make go-build go-vet go-test GO_PKGS="$(go list -tags gms_pure_go ./... | grep -v '/internal/work$' | tr '\n' ' ')"
          - suite: work
            cache: build  # what it compiles is a subset of build-vet-test's, which saves it
            save: false
            run: make go-test GO_PKGS=./internal/work
          - suite: race
            cache: race
            save: true
            run: make go-test-race
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: The Go cache paths and key
        id: paths
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "kind=go-${{ matrix.target }}-${{ steps.go.outputs.go-version }}-${{ matrix.cache }}-" >> "$GITHUB_OUTPUT"
          echo "sum=${{ hashFiles('go.sum') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore main's latest Go cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.paths.outputs.mod }}
            ${{ steps.paths.outputs.build }}
          key: ${{ steps.paths.outputs.kind }}${{ steps.paths.outputs.sum }}${{ github.sha }}
          restore-keys: |
            ${{ steps.paths.outputs.kind }}${{ steps.paths.outputs.sum }}
            ${{ steps.paths.outputs.kind }}
      - name: ${{ matrix.suite }}
        run: ${{ matrix.run }}
      - name: Record the binary
        if: matrix.suite == 'build-vet-test'
        run: |
          go version -m .go/pm | grep -E 'CGO_ENABLED=1|GOOS|GOARCH'
          size=$(wc -c < .go/pm | tr -d ' ')
          echo "Go pm ${{ matrix.target }}: $size bytes, stripped (-s -w), cgo" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the Go cache
        if: >-
          matrix.save && (github.ref == 'refs/heads/main' ||
          !startsWith(steps.restore.outputs.cache-matched-key, format('{0}{1}', steps.paths.outputs.kind, steps.paths.outputs.sum)))
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.paths.outputs.mod }}
            ${{ steps.paths.outputs.build }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
