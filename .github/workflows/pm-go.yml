# pm on every pull request: built on both release targets as the release builds it (cgo, native runners), then go vet
# and the Go tests (make test-go), then the release build (release/build.sh) tagged and untagged. The step summary
# records the binary's size per target. pm-tests.yml runs the harness suite.
name: pm go

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pm-go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-amd64
            runner: ubuntu-22.04  # glibc 2.35, the oldest the release links against
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release-build test clones it
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Build, vet and Go tests (make test-go)
        run: make test-go
      - name: The release build takes its version from the tag alone (release/build.sh, twice, in a scratch clone)
        run: PM_RELEASE_BUILD=1 uv run --quiet python -m pytest -q -p no:cacheprovider tests/test_release.py
      - name: Record the binary
        run: |
          go version -m .go/pm | grep -E 'CGO_ENABLED=1|GOOS|GOARCH'
          size=$(wc -c < .go/pm | tr -d ' ')
          echo "Go pm ${{ matrix.target }}: $size bytes, stripped (-s -w), cgo" | tee -a "$GITHUB_STEP_SUMMARY"
