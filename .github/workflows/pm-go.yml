# pm on every pull request: built on both release targets as the release builds it (cgo, native runners), the gofmt
# check, go vet and the Go tests (make test-go), split into parallel jobs. On Linux: the build (pm, the page renderer
# and pm-before), gofmt, vet and every package's tests but internal/work's; internal/work's tests, the longest, in
# processes at once (make go-test-work); the race tests. On macOS, two jobs, since GitHub runs at most 5 macOS jobs at
# once across all of the repo's runs (Linux takes 20): pm's build, every package's tests but internal/work's, and
# internal/work's, at once; the race tests. gofmt and vet read the same files on both targets (no Go file is
# OS-specific), and the renderer and pm-before serve only the harness, which runs on Linux, so they run there alone.
# The step summary records the binary's size per target. pm-release-build.yml runs the release build test,
# pm-tests.yml the harness suite.
#
# A pull request whose changed files no Go job reads (.github/scripts/go_changes.py: docs, the harness's and the
# release tools' Python) skips each job's steps after the check, so every job still reports, as merge_ready.py
# requires of a workflow that runs on every PR, and passes. A push to main runs everything.
#
# The Go caches (GOMODCACHE and GOCACHE) are saved by each push to main, one per target, Go version, kind (build, race)
# and go.sum, and a pull request restores main's latest, so a PR compiles only what it changed. A run that finds none
# for its go.sum (a dependency change, a new Go version, an evicted cache) restores the latest of its kind and saves its
# own, so the PR's next push is warm. A run whose tests fail saves too: what it compiled is as good as a passing run's,
# and a failed push to main would otherwise leave every PR cold until the next green one. A run that saves trims the
# restored build cache to what it used first (.github/scripts/go_cache_trim.py), so the cache, and each restore of it,
# does not grow with every save. The module cache is saved without its downloaded zips: a build reads only the unpacked
# modules beside them, and the zips, already compressed, only lengthen each restore (actions/cache's `!` paths cannot
# leave them out: it archives a listed directory whole). The key's `unzipped` names that form, so no run restores a
# cache saved with them. GOFLAGS=-count=1: the restored cache never stands in for a test run.
# .github/scripts/setup_go.py installs Go, as actions/setup-go does but without its 12 s copy into the runner's tool
# cache.
name: pm go

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pm-go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-22.04, suite: build-vet-test, cache: build, save: true, binary: true,
             run: make go-build go-fmt go-vet go-test-but-work}
          # what work compiles is a subset of build-vet-test's, which saves it
          - {target: linux-amd64, runner: ubuntu-22.04, suite: work, cache: build, save: false, run: make go-test-work}
          - {target: linux-amd64, runner: ubuntu-22.04, suite: race, cache: race, save: true, run: make -j2 go-test-race}
          # at once: pm's link waits on I/O more than it computes, and the tests on git and Dolt
          - {target: darwin-arm64, runner: macos-14, suite: build-test, cache: build, save: true, binary: true,
             run: make -j3 go-build-pm go-test-but-work go-test-work}
          - {target: darwin-arm64, runner: macos-14, suite: race, cache: race, save: true, run: make -j2 go-test-race}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # a PR's merge commit and its base, which go_changes.py diffs
      - name: Whether the changes can affect the Go jobs
        id: changes
        run: python3 .github/scripts/go_changes.py
      - name: Go, at go.mod's version
        id: go
        if: steps.changes.outputs.go == 'true'
        run: python3 .github/scripts/setup_go.py
      - name: The Go cache paths and key
        id: paths
        if: steps.changes.outputs.go == 'true'
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "kind=go-unzipped-${{ matrix.target }}-${{ steps.go.outputs.go-version }}-${{ matrix.cache }}-" >> "$GITHUB_OUTPUT"
          echo "sum=${{ hashFiles('go.sum') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore main's latest Go cache
        id: restore
        if: steps.changes.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.paths.outputs.mod }}
            ${{ steps.paths.outputs.build }}
          key: ${{ steps.paths.outputs.kind }}${{ steps.paths.outputs.sum }}${{ github.sha }}
          restore-keys: |
            ${{ steps.paths.outputs.kind }}${{ steps.paths.outputs.sum }}
            ${{ steps.paths.outputs.kind }}
      - name: Age the restored Go build cache, so the save keeps only what this run uses
        id: age
        if: >-
          matrix.save && steps.restore.outputs.cache-matched-key != '' && (github.ref == 'refs/heads/main' ||
          !startsWith(steps.restore.outputs.cache-matched-key, format('{0}{1}', steps.paths.outputs.kind, steps.paths.outputs.sum)))
        run: python3 .github/scripts/go_cache_trim.py age "${{ steps.paths.outputs.build }}"
      - name: ${{ matrix.suite }}
        id: suite
        if: steps.changes.outputs.go == 'true'
        run: ${{ matrix.run }}
      - name: Record the binary
        if: matrix.binary && steps.suite.outcome == 'success'
        run: |
          go version -m .go/pm | grep -E 'CGO_ENABLED=1|GOOS|GOARCH'
          size=$(wc -c < .go/pm | tr -d ' ')
          echo "Go pm ${{ matrix.target }}: $size bytes, stripped (-s -w), cgo" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Trim the Go build cache to what this run used
        if: "!cancelled() && steps.age.outcome == 'success' && steps.suite.outcome != 'skipped'"
        run: python3 .github/scripts/go_cache_trim.py trim "${{ steps.paths.outputs.build }}"
      - name: Drop the module cache's zips before the save
        if: >-
          !cancelled() && steps.suite.outcome != 'skipped' && matrix.save && (github.ref == 'refs/heads/main' ||
          !startsWith(steps.restore.outputs.cache-matched-key, format('{0}{1}', steps.paths.outputs.kind, steps.paths.outputs.sum)))
        run: |
          zips="${{ steps.paths.outputs.mod }}/cache/download"
          find "$zips" -name '*.zip' -exec du -k {} + | awk '{k += $1; n++} END {printf "%d zips, %d MB\n", n, k / 1024}'
          find "$zips" -name '*.zip' -delete
      - name: Save the Go cache
        if: >-
          !cancelled() && steps.suite.outcome != 'skipped' && matrix.save && (github.ref == 'refs/heads/main' ||
          !startsWith(steps.restore.outputs.cache-matched-key, format('{0}{1}', steps.paths.outputs.kind, steps.paths.outputs.sum)))
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.paths.outputs.mod }}
            ${{ steps.paths.outputs.build }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
