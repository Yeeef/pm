# AGENTS.md graded against tests/agents_md/rubric.md (make agents-md-check). On every pull request, diff mode alone:
# whether the PR's diff makes an AGENTS.md claim false or adds a rule it lacks. No paths filter, so
# release/merge_ready.py requires its check on every PR. Daily on main (and on demand), when AGENTS.md or the grader
# (evaluate.py's GRADER: tests/agents_md/, the live test, this workflow) changed since the last successful such run:
# every criterion on the whole file (full mode), and the grader's planted and diff cases once (make
# test-live-agents-md); a full mode and the cases take 3 to 5 min of model calls each, too long to hold up every PR that edits these
# files. claude -p reaches the Anthropic API through workload identity federation: a GitHub OIDC token (id-token:
# write) that tests/agents_md/evaluate.py writes fresh to ANTHROPIC_IDENTITY_TOKEN_FILE before each call; no API key
# is stored.
name: agents md

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: agents-md-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read  # the daily run finds the last successful one
  contents: read
  id-token: write

env:
  CLAUDE_CODE_VERSION: 2.1.296  # both jobs install this exact Claude Code; the labelled cases were calibrated on it
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_01FPgmhV9MXPPY18z4vYRWUd
  ANTHROPIC_ORGANIZATION_ID: 16513404-406e-458a-92bb-0720e7d32b6a
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_019ad6gM9VcxVkWWU71SXEp7
  ANTHROPIC_WORKSPACE_ID: wrkspc_01RCWcFPuwwkSKicviSZBree

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Diff mode makes 10 calls per 60 KB chunk of the diff, 16 at a time, each wave at most 460 s (an OIDC token fetch
    # of up to 30 s, the call killed at 420 s, 10 s to reap it): a diff of up to 480 KB (80 calls, 5 waves) is done
    # within 39 min, plus setup
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff runs from the merge base with the PR's base branch
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Grade the PR's diff against AGENTS.md (make agents-md-check MODE=diff)
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
        run: make agents-md-check MODE=diff BASE=origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-md
          path: .go/agents-md.json
          if-no-files-found: ignore
  changed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff runs from the last successful run's commit
      # The paths are AGENTS.md and evaluate.py's GRADER (tests/test_agents_md_eval.py holds the two equal). A
      # successful run either graded its commit or found nothing changed since an earlier successful run, so the diff
      # from the latest one covers every change not yet graded. A gh or git failure fails the run: no guess.
      - name: Did AGENTS.md or the grader change since the last successful run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow agents-md.yml --branch "$GITHUB_REF_NAME" --status success --limit 20 \
            --json headSha,event --jq 'map(select(.event != "pull_request"))[0].headSha // ""')
          if [ -z "$last" ]; then
            echo "No earlier successful run on $GITHUB_REF_NAME: grade in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(git diff --name-only "$last" HEAD)
          if grep -qE '^(AGENTS\.md$|tests/agents_md/|tests/test_agents_md_live\.py$|\.github/workflows/agents-md\.yml$)' <<< "$names"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Neither AGENTS.md nor the grader changed since $last, the last successful run: nothing to grade."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  full:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Full mode on an AGENTS.md of 11 sections makes 90 calls, 16 at a time: 6 waves, each at most 460 s (as check's),
    # so done within 46 min, plus setup
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Grade AGENTS.md in full (make agents-md-check MODE=full)
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
        run: make agents-md-check MODE=full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-md
          path: .go/agents-md.json
          if-no-files-found: ignore
  cases:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The planted and diff cases make about 170 calls, 16 at a time: 11 waves of at most 460 s each (as check's), so
    # done within 85 min at worst, plus setup; a run typically takes about 4 min
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@v6
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The grader's planted and diff cases, one run each (make test-live-agents-md)
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
          PM_LIVE_RUNS: "1"
          # The clean case grades this commit's AGENTS.md in full mode, which the full job does: here it would only
          # repeat that verdict, and fail the job on its noise. A local run keeps it.
          PM_AGENTS_MD_SKIP: clean
        run: make test-live-agents-md
