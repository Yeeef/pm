# AGENTS.md graded against tests/agents_md/rubric.md on every pull request (make agents-md-check): every criterion on
# the whole file when the PR changes AGENTS.md or the grader (evaluate.py's GRADER: tests/agents_md/, the live test,
# this workflow), else whether the PR's diff makes an AGENTS.md claim false or adds a rule it lacks. No paths filter,
# so release/merge_ready.py requires its check on every PR. claude -p reaches the Anthropic API through workload
# identity federation: a GitHub OIDC token (id-token: write) that tests/agents_md/evaluate.py writes fresh to
# ANTHROPIC_IDENTITY_TOKEN_FILE before each call; no API key is stored. A PR that changes the grader also runs its
# planted and diff cases once (make test-live-agents-md).
name: agents md

on:
  pull_request:

concurrency:
  group: agents-md-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CLAUDE_CODE_VERSION: 2.1.296  # both jobs install this exact Claude Code; the labelled cases were calibrated on it
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_01FPgmhV9MXPPY18z4vYRWUd
  ANTHROPIC_ORGANIZATION_ID: 16513404-406e-458a-92bb-0720e7d32b6a
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_019ad6gM9VcxVkWWU71SXEp7
  ANTHROPIC_WORKSPACE_ID: wrkspc_01RCWcFPuwwkSKicviSZBree

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff runs from the merge base with the PR's base branch
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Grade AGENTS.md (make agents-md-check)
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
        run: make agents-md-check BASE=origin/${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agents-md
          path: .go/agents-md.json
          if-no-files-found: ignore
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The grader's paths, evaluate.py's GRADER (tests/test_agents_md_eval.py holds the two equal). The harness files
      # the live test runs under (conftest.py, run.py, the Makefile) are not among them: the light suite covers them.
      - name: Does the PR change the grader?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
              grep -qE '^(tests/agents_md/|tests/test_agents_md_live\.py$|\.github/workflows/agents-md\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The PR leaves the grader alone: its labelled cases do not run."
          fi
      - uses: actions/setup-go@v5
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@v6
        if: steps.changed.outputs.run == 'true'
      - name: Install Claude Code
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The grader's planted and diff cases, one run each (make test-live-agents-md)
        if: steps.changed.outputs.run == 'true'
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/oidc-token
          PM_LIVE_RUNS: "1"
          # The clean case grades this commit's AGENTS.md in full mode, which check already does on a grader change:
          # here it would only repeat check's verdict, and fail the job on its noise. A local run keeps it.
          PM_AGENTS_MD_SKIP: clean
        run: make test-live-agents-md
