[project]
name = "pm"
version = "0.1.0"
description = "Project records CLI: Beads for the work, Markdown records for the context, a rendered site for the owner."
requires-python = ">=3.12"
dependencies = ["markdown-it-py>=3", "mdit-py-plugins>=0.4", "pyyaml>=6"]

[project.scripts]
pm = "pm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm"]
