# The harness's environment: the pytest suite in tests/, which drives the pm binary `make go-build` builds. pm itself
# is Go (go.mod); nothing here is a Python package.
[project]
name = "pm-harness"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.uv]
package = false
